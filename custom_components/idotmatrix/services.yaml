set_face:
  name: Set face
  description: Apply a layered face configuration from the designer.
  fields:
    face:
      required: true
      description: Face configuration with layers and optional trigger_entity.
      example:
        {
          "layers": [
            {
              "id": "1",
              "template": "{{ now().strftime('%H:%M') }}",
              "x": 0,
              "y": 8,
              "color": [0, 255, 0],
              "font_size": 10
            }
          ],
          "trigger_entity": "sensor.time"
        }
      selector:
        object:

set_saved_design:
  name: Set saved design
  description: Apply a saved design by name.
  fields:
    name:
      required: true
      example: "My Design"
      selector:
        text:

render_preview:
  name: Render preview
  description: Render a face preview image and return a base64 PNG.
  fields:
    face:
      required: true
      selector:
        object:
    screen_size:
      required: false
      example: 32
      selector:
        number:
          min: 8
          max: 64
          mode: box

list_fonts:
  name: List fonts
  description: Return available fonts for the designer.

display_gif:
  name: Display GIF
  description: Display animated GIFs on the iDotMatrix device. Can show a single GIF or rotate through a folder of GIFs.
  fields:
    path:
      required: true
      description: Path to a GIF file or folder containing GIF files.
      example: "/config/www/idotmatrix/gifs"
      selector:
        text:
    rotation_interval:
      required: false
      description: Carousel interval - how long each GIF displays before advancing to the next (batch mode only). The device handles the rotation natively. Common values are 5, 10, 30, 60, or 300 seconds.
      default: 5
      example: 10
      selector:
        number:
          min: 1
          max: 255
          unit_of_measurement: seconds
          mode: box

stop_gif_rotation:
  name: Stop GIF Rotation
  description: Stop the current GIF rotation if one is running.

show_weather:
  name: Show weather dashboard
  description: >
    Display an animated weather dashboard with pixel-art condition icons,
    temperature, high/low, humidity and wind. Data comes from a weather
    entity, individual sensors, or a mix of both (sensor overrides win).
    By default the display keeps updating automatically when the source
    entities change.
  fields:
    weather_entity:
      required: false
      description: Weather entity used for condition, temperature, humidity, wind and forecast high/low.
      default: weather.openweathermap
      example: weather.openweathermap
      selector:
        entity:
          domain: weather
    condition_entity:
      required: false
      description: Sensor overriding the condition. Accepts HA conditions or free text like "broken clouds" / "light rain" (e.g. an OpenWeatherMap weather sensor).
      example: sensor.openweathermap_weather
      selector:
        entity:
          domain: sensor
    temperature_entity:
      required: false
      description: Sensor overriding the temperature (e.g. a local weather station).
      example: sensor.gw2000b_outdoor_temperature
      selector:
        entity:
          domain: sensor
    humidity_entity:
      required: false
      description: Sensor overriding the humidity.
      example: sensor.gw2000b_humidity
      selector:
        entity:
          domain: sensor
    wind_entity:
      required: false
      description: Sensor overriding the wind speed.
      selector:
        entity:
          domain: sensor
    high_entity:
      required: false
      description: Sensor overriding today's forecast high.
      selector:
        entity:
          domain: sensor
    low_entity:
      required: false
      description: Sensor overriding today's forecast low.
      selector:
        entity:
          domain: sensor
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full dashboard, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when source entities change (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_weather:
  name: Stop weather dashboard
  description: Stop weather dashboard auto-updates.

show_bitcoin:
  name: Show Bitcoin ticker
  description: >
    Display an animated Bitcoin price ticker with a spinning pixel-art
    Bitcoin coin. The price is colored by the direction of its last move
    (green up, red down). By default the display keeps updating
    automatically when the price changes.
  fields:
    price_entity:
      required: false
      description: Sensor with the current USD price. Defaults to sensor.bitcoin_price.
      default: sensor.bitcoin_price
      example: sensor.bitcoin_price
      selector:
        entity:
          domain: sensor
    change_entity:
      required: false
      description: Optional sensor with the 24h change percentage, shown below the price.
      selector:
        entity:
          domain: sensor
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full ticker, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when the price changes (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_bitcoin:
  name: Stop Bitcoin ticker
  description: Stop Bitcoin ticker auto-updates.

show_co2:
  name: Show CO2 gauge
  description: >
    Display a CO2 concentration gauge with a color-coded bar and status
    label (Good/OK/Fair/Poor/Bad). The gauge updates automatically when
    the sensor value changes.
  fields:
    co2_entity:
      required: false
      description: Sensor with the current CO2 concentration in ppm.
      default: sensor.aranet4_19d46_carbon_dioxide
      example: sensor.aranet4_19d46_carbon_dioxide
      selector:
        entity:
          domain: sensor
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full gauge, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when the CO2 level changes (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_co2:
  name: Stop CO2 gauge
  description: Stop CO2 gauge auto-updates.

show_power:
  name: Show power gauge
  description: >
    Display whole-house power usage with a color-coded bar gauge scaled
    0-5000 W and a status label (Low/Norm/Med/High/Peak/Max). The gauge
    updates automatically (at most every 15s) as the power sensor changes.
  fields:
    power_entity:
      required: false
      description: Sensor with the current total active power in watts.
      default: sensor.shellypro3em_0cb815fd2f44_total_active_power
      example: sensor.shellypro3em_0cb815fd2f44_total_active_power
      selector:
        entity:
          domain: sensor
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full gauge, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when power usage changes (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_power:
  name: Stop power gauge
  description: Stop power gauge auto-updates.

show_clock:
  name: Show clock
  description: >
    Display a clock. The default "pixel" face is rendered by the
    integration in the house pixel-art style (big HH:MM with a blinking
    colon, weekday, date) and re-uploaded each minute. Faces 0-7 use the
    device's built-in firmware clock styles, which keep time on the panel
    itself with no further BLE traffic.
  fields:
    face:
      required: false
      description: '"pixel" for the custom rendered face, or a native firmware style 0-7.'
      default: pixel
      selector:
        select:
          options:
            - "pixel"
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "7"
    color:
      required: false
      description: Accent color for the pixel face, or text color for native styles. Default [100, 180, 255].
      selector:
        color_rgb:
    hour24:
      required: false
      description: 24-hour format (default true).
      default: true
      selector:
        boolean:
    show_date:
      required: false
      description: Show the date (default true).
      default: true
      selector:
        boolean:
    pixel_size:
      required: false
      description: Display resolution for the pixel face. 64 renders the full layout, 32 a compact one.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the pixel face updated every minute (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_clock:
  name: Stop clock
  description: Stop clock updates (pixel face) and clock mode tracking.
